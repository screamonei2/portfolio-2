<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Elegance | 3D Spatial Architecture</title>

    <!-- GSAP & ScrollTrigger -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>

    <!-- Lenis for smooth cinematic scrolling -->
    <script src="https://unpkg.com/@studio-freight/lenis@1.0.39/dist/lenis.min.js"></script>

    <!-- Three.js Import Map -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <style>
        /* Base Reset & Atmospheric Background */
        body,
        html {
            margin: 0;
            padding: 0;
            background-color: #030305;
            color: #ffffff;
            font-family: monospace;
            overflow-x: hidden;
            overscroll-behavior: none;
        }

        /* Lenis CSS */
        html.lenis,
        html.lenis body {
            height: auto;
        }

        .lenis.lenis-smooth {
            scroll-behavior: auto !important;
        }

        .lenis.lenis-smooth [data-lenis-prevent] {
            overscroll-behavior: contain;
        }

        .lenis.lenis-stopped {
            overflow: hidden;
        }

        /* WebGL Canvas */
        #webgl-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            pointer-events: none;
        }

        /* Scroll Proxy to anchor GSAP camera scrollytelling (3 Viewports total) */
        #scroll-proxy {
            height: 300vh;
            width: 100%;
            position: relative;
            z-index: 2;
        }

        /* Spatial UI / HUD Styling */
        .spatial-point { position: absolute; }
        .dot { width: 4px; height: 4px; border-radius: 50%; box-shadow: 0 0 10px; }
        .dot.yellow { background: #ffcc00; box-shadow: 0 0 10px #ffcc00; }
        .dot.cyan { background: #00e5ff; box-shadow: 0 0 10px #00e5ff; }
        .line { position: absolute; height: 1px; transform-origin: left center; }
        .yellow-line { background: rgba(255, 204, 0, 0.4); }
        .cyan-line { background: rgba(0, 229, 255, 0.4); }
        .label { position: absolute; font-family: monospace; font-size: 9px; letter-spacing: 2px; color: rgba(255,255,255,0.7); text-transform: uppercase; white-space: nowrap; }

        /* Mobile Responsive Adjustments */
        @media (max-width: 768px) {
            #detail-panel {
                width: 90vw !important;
                right: -95vw !important;
                padding: 2.5rem 1.5rem !important;
            }
            .label {
                font-size: 8px !important;
                letter-spacing: 1px !important;
            }
        }
    </style>
</head>

<body>

    <!-- WebGL Background -->
    <div id="webgl-container"></div>

    <!-- Scroll Proxy for 3D Camera Scrollytelling -->
    <div id="scroll-proxy"></div>

    <!-- Spatial HUD Layer -->
    <div id="hud-layer" style="position: fixed; width: 100vw; height: 100vh; pointer-events: none; z-index: 10; top: 0; left: 0;">
        <div id="hud-hero" style="position: absolute; width: 100%; height: 100%; opacity: 0; transition: opacity 0.4s;"></div>
        <div id="hud-case1" style="position: absolute; width: 100%; height: 100%; opacity: 0; transition: opacity 0.4s;">
            <div class="spatial-point" style="top: 30%; left: 35%;">
                <div class="dot yellow"></div>
                <div class="line yellow-line" style="width: 80px; transform: rotate(-45deg);"></div>
                <div class="label" style="transform: translate(-100px, -60px);">CLIENT_01<br>TIPO: SAAS</div>
            </div>
            <div class="spatial-point" style="top: 70%; left: 65%;">
                <div class="dot yellow"></div>
                <div class="line yellow-line" style="width: 120px; transform: rotate(15deg);"></div>
                <div class="label" style="transform: translate(140px, 10px);">CLIQUE PARA EXPANDIR</div>
            </div>
        </div>
        <div id="hud-case2" style="position: absolute; width: 100%; height: 100%; opacity: 0; transition: opacity 0.4s;">
            <div class="spatial-point" style="top: 30%; left: 35%;">
                <div class="dot cyan"></div>
                <div class="line cyan-line" style="width: 80px; transform: rotate(-45deg);"></div>
                <div class="label" style="transform: translate(-100px, -60px);">CLIENT_02<br>TIPO: AI PLATFORM</div>
            </div>
            <div class="spatial-point" style="top: 70%; left: 65%;">
                <div class="dot cyan"></div>
                <div class="line cyan-line" style="width: 120px; transform: rotate(15deg);"></div>
                <div class="label" style="transform: translate(140px, 10px);">CLIQUE PARA EXPANDIR</div>
            </div>
        </div>
    </div>

    <!-- Case Study Detail Panel (Glassmorphism) -->
    <div id="detail-panel" style="position: fixed; right: -50vw; top: 0; width: 40vw; height: 100vh; background: rgba(5,5,5,0.75); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); z-index: 50; padding: 4rem; box-sizing: border-box; transition: right 0.8s cubic-bezier(0.16, 1, 0.3, 1);">
        <button id="close-panel" style="background: none; border: 1px solid rgba(255,255,255,0.2); color: white; padding: 10px 20px; cursor: pointer; font-family: monospace;">[ X ] FECHAR</button>
        <h2 id="detail-title" style="margin-top: 4rem; font-size: 2rem; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 1rem;">CASE STUDY</h2>
        <p id="detail-desc" style="color: rgba(255,255,255,0.6); line-height: 1.6; margin-top: 2rem;">A visual breakdown of the architecture, design tokens, and systematic refresh implemented to shift the product narrative.</p>
    </div>

    <!-- Main 3D Logic -->
    <script type="module">
        import * as THREE from 'three';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
        import { BokehPass } from 'three/addons/postprocessing/BokehPass.js';
        import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
        import { RGBShiftShader } from 'three/addons/shaders/RGBShiftShader.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        // ==========================================
        // 1. Smooth Scrolling Setup (Lenis + GSAP)
        // ==========================================
        const isMobile = window.innerWidth < 768;

        const lenis = new Lenis({
            duration: 1.5,
            easing: (t) => Math.min(1, 1.001 - Math.pow(2, -10 * t)),
            direction: 'vertical',
            smooth: true,
            smoothTouch: false, // Allows native mobile touch scrolling without hijacking
            touchMultiplier: 1.5,
        });

        function raf(time) {
            lenis.raf(time);
            requestAnimationFrame(raf);
        }
        requestAnimationFrame(raf);

        gsap.registerPlugin(ScrollTrigger);
        lenis.on('scroll', ScrollTrigger.update);
        gsap.ticker.add((time) => { lenis.raf(time * 1000); });
        gsap.ticker.lagSmoothing(0);

        // ==========================================
        // 2. Three.js Scene Setup
        // ==========================================
        const container = document.getElementById('webgl-container');

        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x030305, 0.035);

        // Camera Group for Camera Scrollytelling
        const cameraGroup = new THREE.Group();
        scene.add(cameraGroup);

        const camera = new THREE.PerspectiveCamera(35, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(0, 0, 18);
        cameraGroup.add(camera);

        const renderer = new THREE.WebGLRenderer({ antialias: !isMobile, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, isMobile ? 1.5 : 2.0));
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.6;
        container.appendChild(renderer.domElement);

        renderer.domElement.addEventListener('webglcontextlost', (e) => {
            e.preventDefault();
            console.warn('WebGL context lost - attempting recovery');
        }, false);

        // ==========================================
        // 3. Environment & Lighting
        // ==========================================
        const pmremGenerator = new THREE.PMREMGenerator(renderer);
        pmremGenerator.compileEquirectangularShader();

        const envScene = new THREE.Scene();
        envScene.background = new THREE.Color(0x050505);
        const lightPlane1 = new THREE.Mesh(new THREE.PlaneGeometry(20, 20), new THREE.MeshBasicMaterial({ color: 0x444444 }));
        lightPlane1.position.set(0, 15, 0); lightPlane1.rotation.x = Math.PI / 2;
        const lightPlane2 = new THREE.Mesh(new THREE.PlaneGeometry(20, 20), new THREE.MeshBasicMaterial({ color: 0x444444 }));
        lightPlane2.position.set(15, 0, 0); lightPlane2.rotation.y = -Math.PI / 2;
        envScene.add(lightPlane1, lightPlane2);
        scene.environment = pmremGenerator.fromScene(envScene).texture;

        // Global Soft Ambient Light (Eliminates pitch-black shadows)
        const ambientLight = new THREE.AmbientLight(0xffffff, 2.5);
        scene.add(ambientLight);

        // Soft Front Fill Light (Ensures high visibility without harsh specular spots)
        const fillLight = new THREE.DirectionalLight(0xffffff, 1.5);
        fillLight.position.set(0, 0, 10);
        scene.add(fillLight);

        // Key Light (Soft studio light)
        const keyLight = new THREE.DirectionalLight(0xeeeeee, 1.2);
        keyLight.position.set(5, 5, 5);
        scene.add(keyLight);

        // Rim Light (Subtle edge definition)
        const rimLight = new THREE.DirectionalLight(0x888888, 0.8);
        rimLight.position.set(-10, 5, -10);
        scene.add(rimLight);

        // Dedicated Accent Light for Hero (Red Magma) at y = 0
        const obj1Light = new THREE.PointLight(0xff3300, 48, 25);
        obj1Light.position.set(0, 0, 6);
        scene.add(obj1Light);

        // Dedicated Accent Light for Case 1 (Vibrant Yellow) at y = -14
        const obj2Light = new THREE.PointLight(0xffcc00, 6, 20);
        obj2Light.position.set(0, -14, 8);
        scene.add(obj2Light);

        // Dedicated Accent Light for Case 2 (Electric Cyan) at y = -28
        const obj3Light = new THREE.PointLight(0x00e5ff, 6, 20);
        obj3Light.position.set(0, -28, 8);
        scene.add(obj3Light);

        // ==========================================
        // 3.5 Abyssal Monoliths (Depth & Parallax Anchors)
        // ==========================================
        const monolithGeo = new THREE.BoxGeometry(4, 40, 4);
        const monolithMat = new THREE.MeshStandardMaterial({
            color: 0x050505, // Quase invisível, misturando com o fundo
            roughness: 0.9,
            metalness: 0.1,
            envMapIntensity: 0.2
        });

        const bgGroup = new THREE.Group();
        scene.add(bgGroup);

        // Gerar pilares espalhados pelo abismo
        for (let i = 0; i < 25; i++) {
            const mesh = new THREE.Mesh(monolithGeo, monolithMat);

            // Distribuir no eixo X (laterais), Y (altura total do scroll) e Z (fundo)
            const x = (Math.random() - 0.5) * 60; // Espalhados horizontalmente
            const y = (Math.random() - 0.5) * 80 - 20; // Cobrindo de +20 a -60 no eixo Y
            const z = -20 - Math.random() * 40; // Profundidade Z (-20 a -60)

            mesh.position.set(x, y, z);

            // Rotações randômicas para não parecerem blocos perfeitos
            mesh.rotation.y = Math.random() * Math.PI;
            mesh.rotation.x = (Math.random() - 0.5) * 0.2;
            mesh.rotation.z = (Math.random() - 0.5) * 0.2;

            // Variação massiva de escala
            const scale = 0.5 + Math.random() * 2.5;
            mesh.scale.set(scale, scale, scale);

            bgGroup.add(mesh);
        }

        // ==========================================
        // 4. Object Containers (Spatial Architecture)
        // ==========================================
        // Object 1 (Hero) at (0, 0, 0) - Viewport 1
        const obj1Container = new THREE.Group();
        obj1Container.position.set(0, 0, 0);
        const obj1Scroll = new THREE.Group();
        const obj1Parallax = new THREE.Group();
        obj1Parallax.position.set(0, 0, 0);
        obj1Scroll.add(obj1Parallax);
        obj1Container.add(obj1Scroll);

        // Object 2 (Case 1) at (0, -14, 0) - Viewport 2 (Exact 1 Viewport height down)
        const obj2Container = new THREE.Group();
        obj2Container.position.set(0, -14, 0);
        const obj2Scroll = new THREE.Group();
        const obj2Parallax = new THREE.Group();
        obj2Parallax.position.set(0, 0, 0);
        obj2Scroll.add(obj2Parallax);
        obj2Container.add(obj2Scroll);

        // Object 3 (Case 2) at (0, -28, 0) - Viewport 3 (Exact 1 Viewport height down from Case 1)
        const obj3Container = new THREE.Group();
        obj3Container.position.set(0, -28, 0);
        const obj3Scroll = new THREE.Group();
        const obj3Parallax = new THREE.Group();
        obj3Parallax.position.set(0, 0, 0);
        obj3Scroll.add(obj3Parallax);
        obj3Container.add(obj3Scroll);

        scene.add(obj1Container, obj2Container, obj3Container);

        // Helper to generate a high-contrast emissive mask from texture (isolates bright cracks, locks rock body to black)
        function createThresholdEmissiveMap(texture, threshold = 0.55) {
            if (isMobile || !texture || !texture.image) return texture;

            try {
                const img = texture.image;
                const canvas = document.createElement('canvas');
                const width = img.width || img.videoWidth || 1024;
                const height = img.height || img.videoHeight || 1024;
                canvas.width = width;
                canvas.height = height;
                const ctx = canvas.getContext('2d');

                ctx.drawImage(img, 0, 0, width, height);
                const imgData = ctx.getImageData(0, 0, width, height);
                const data = imgData.data;

                for (let i = 0; i < data.length; i += 4) {
                    const r = data[i];
                    const g = data[i + 1];
                    const b = data[i + 2];
                    const luminance = (0.299 * r + 0.587 * g + 0.114 * b) / 255;

                    if (luminance < threshold) {
                        data[i] = 0;
                        data[i + 1] = 0;
                        data[i + 2] = 0;
                    } else {
                        const factor = Math.pow((luminance - threshold) / (1 - threshold), 1.5);
                        data[i] = Math.min(255, Math.round(r * factor * 2));
                        data[i + 1] = Math.min(255, Math.round(g * factor * 2));
                        data[i + 2] = Math.min(255, Math.round(b * factor * 2));
                    }
                }

                ctx.putImageData(imgData, 0, 0);

                const canvasTexture = new THREE.CanvasTexture(canvas);
                canvasTexture.flipY = texture.flipY;
                canvasTexture.wrapS = texture.wrapS;
                canvasTexture.wrapT = texture.wrapT;
                canvasTexture.needsUpdate = true;
                return canvasTexture;
            } catch (e) {
                console.warn('Emissive mask canvas fallback:', e);
                return texture;
            }
        }

        // ==========================================
        // 5. Load 3D Models & Materials (with Hover Caching)
        // ==========================================
        const gltfLoader = new GLTFLoader();
        let soulStoneModel1 = null;
        let soulStoneModel2 = null;
        let soulStoneModel3 = null;

        const targetMeshes1 = [];
        const emissiveMats1 = [];
        const targetMeshes2 = [];
        const emissiveMats2 = [];
        const targetMeshes3 = [];
        const emissiveMats3 = [];

        const baseModelScaleFactor = isMobile ? 3.6 : 5.0;

        Promise.all([
            gltfLoader.loadAsync('./1.glb').catch(e => { console.error('Error loading 1.glb:', e); return null; }),
            gltfLoader.loadAsync('./2.glb').catch(e => { console.error('Error loading 2.glb:', e); return null; }),
            gltfLoader.loadAsync('./3.glb').catch(e => { console.error('Error loading 3.glb:', e); return null; })
        ]).then(([gltf1, gltf2, gltf3]) => {

            // --- Model 1 Setup (Hero) ---
            if (gltf1) {
                soulStoneModel1 = gltf1.scene;

                // Center and scale model BEFORE adding to parent container with Y offset
                const box1 = new THREE.Box3().setFromObject(soulStoneModel1);
                const center1 = box1.getCenter(new THREE.Vector3());
                soulStoneModel1.position.sub(center1);

                const size1 = box1.getSize(new THREE.Vector3()).length();
                soulStoneModel1.userData.baseScale = baseModelScaleFactor / size1;
                soulStoneModel1.scale.setScalar(soulStoneModel1.userData.baseScale);

                obj1Parallax.add(soulStoneModel1);

                soulStoneModel1.traverse((child) => {
                    if (child.isMesh && child.material) {
                        targetMeshes1.push(child);
                        child.material = child.material.clone();

                        // Matte stone material (High roughness & low envMap to eliminate harsh white specular glare)
                        child.material.color.setHex(0xffffff);
                        child.material.roughness = 0.85;
                        child.material.metalness = 0.05;
                        child.material.envMapIntensity = 0.3;

                        // Isolate emission strictly to bright cracks via threshold mask
                        if (child.material.map) {
                            child.material.emissiveMap = createThresholdEmissiveMap(child.material.map, 0.55);
                            child.material.emissive.setHex(0xff3300); // Red Magma
                            child.material.emissiveIntensity = isMobile ? 6.0 : 18.0;
                            emissiveMats1.push(child.material);
                        }

                        child.material.needsUpdate = true;
                    }
                });
            }

            // --- Model 2 Setup (Case 1) ---
            if (gltf2) {
                soulStoneModel2 = gltf2.scene;

                // Center and scale model BEFORE adding to parent container with Y=-14 offset
                const box2 = new THREE.Box3().setFromObject(soulStoneModel2);
                const center2 = box2.getCenter(new THREE.Vector3());
                soulStoneModel2.position.sub(center2);

                const size2 = box2.getSize(new THREE.Vector3()).length();
                soulStoneModel2.userData.baseScale = baseModelScaleFactor / size2;
                soulStoneModel2.scale.setScalar(soulStoneModel2.userData.baseScale);

                obj2Parallax.add(soulStoneModel2);

                soulStoneModel2.traverse((child) => {
                    if (child.isMesh && child.material) {
                        targetMeshes2.push(child);
                        child.material = child.material.clone();

                        // Matte stone material (High roughness & low envMap to eliminate harsh white specular glare)
                        child.material.color.setHex(0xffffff);
                        child.material.roughness = 0.85;
                        child.material.metalness = 0.05;
                        child.material.envMapIntensity = 0.1;

                        // Isolate emission strictly to bright cracks via threshold mask
                        if (child.material.map) {
                            child.material.emissiveMap = createThresholdEmissiveMap(child.material.map, 0.55);
                            child.material.emissive.setHex(0xffcc00); // Vibrant Yellow
                            child.material.emissiveIntensity = 1.0;
                            emissiveMats2.push(child.material);
                        }

                        child.material.needsUpdate = true;
                    }
                });
            }

            // --- Model 3 Setup (Case 2 - Loaded from 3.glb at Y=-28) ---
            if (gltf3) {
                soulStoneModel3 = gltf3.scene;

                // Center and scale model BEFORE adding to parent container with Y=-28 offset
                const box3 = new THREE.Box3().setFromObject(soulStoneModel3);
                const center3 = box3.getCenter(new THREE.Vector3());
                soulStoneModel3.position.sub(center3);

                const size3 = box3.getSize(new THREE.Vector3()).length();
                soulStoneModel3.userData.baseScale = baseModelScaleFactor / size3;
                soulStoneModel3.scale.setScalar(soulStoneModel3.userData.baseScale);

                obj3Parallax.add(soulStoneModel3);

                soulStoneModel3.traverse((child) => {
                    if (child.isMesh && child.material) {
                        targetMeshes3.push(child);
                        child.material = child.material.clone();

                        // Matte stone material (High roughness & low envMap to eliminate harsh white specular glare)
                        child.material.color.setHex(0xffffff);
                        child.material.roughness = 0.85;
                        child.material.metalness = 0.05;
                        child.material.envMapIntensity = 0.1;

                        // Isolate emission strictly to bright cracks via threshold mask
                        if (child.material.map) {
                            child.material.emissiveMap = createThresholdEmissiveMap(child.material.map, 0.55);
                            child.material.emissive.setHex(0x00e5ff); // Electric Cyan
                            child.material.emissiveIntensity = 1.0;
                            emissiveMats3.push(child.material);
                        }

                        child.material.needsUpdate = true;
                    }
                });
            }

            ScrollTrigger.refresh();
        });

        // Helper to generate glowing RPG bonfire spark texture (soft white-hot core, glowing flame edges)
        function createEmberTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 64;
            canvas.height = 64;
            const ctx = canvas.getContext('2d');

            const gradient = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
            gradient.addColorStop(0.0, 'rgba(255, 255, 255, 1.0)');  // White-hot spark core
            gradient.addColorStop(0.2, 'rgba(255, 220, 100, 0.9)');  // Golden mid-glow
            gradient.addColorStop(0.5, 'rgba(255, 80, 0, 0.6)');    // Fiery orange edge
            gradient.addColorStop(1.0, 'rgba(0, 0, 0, 0.0)');       // Soft transparent blur

            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.arc(32, 32, 32, 0, Math.PI * 2);
            ctx.fill();

            const texture = new THREE.CanvasTexture(canvas);
            texture.needsUpdate = true;
            return texture;
        }

        // ==========================================
        // 6. Interactive RPG Bonfire Embers (Particles Setup)
        // ==========================================
        const pCount = isMobile ? 800 : 2000;
        const particlesGeo = new THREE.BufferGeometry();
        const pArray = new Float32Array(pCount * 3);
        const pColors = new Float32Array(pCount * 3);
        const velocities = new Float32Array(pCount * 3);
        const baseVelocitiesY = new Float32Array(pCount);
        const particleOffsets = new Float32Array(pCount);

        // RPG Bonfire Ember Palette (Fiery Red, Magma Orange, Amber, Gold, Yellow, White-Hot)
        const emberPalette = [
            new THREE.Color(0xff2200), // Deep Fiery Red
            new THREE.Color(0xff5500), // Magma Orange
            new THREE.Color(0xff8800), // Rich Amber
            new THREE.Color(0xffbb00), // Hot Gold
            new THREE.Color(0xffee77), // Bright Yellow
            new THREE.Color(0xffffff)  // White Hot Spark
        ];

        for (let i = 0; i < pCount; i++) {
            const i3 = i * 3;
            pArray[i3] = (Math.random() - 0.5) * 40;        // X: -20 to +20
            pArray[i3 + 1] = (Math.random() - 0.5) * 70 - 20; // Y: +15 to -55
            pArray[i3 + 2] = (Math.random() - 0.5) * 40;    // Z: -20 to +20

            velocities[i3] = (Math.random() - 0.5) * 0.01;
            velocities[i3 + 1] = 0.03 + Math.random() * 0.04; // Base thermal upward velocity
            velocities[i3 + 2] = (Math.random() - 0.5) * 0.01;

            baseVelocitiesY[i] = velocities[i3 + 1];
            particleOffsets[i] = Math.random() * Math.PI * 2;

            // Pick random ember color from RPG bonfire palette
            const col = emberPalette[Math.floor(Math.random() * emberPalette.length)];
            pColors[i3] = col.r;
            pColors[i3 + 1] = col.g;
            pColors[i3 + 2] = col.b;
        }

        particlesGeo.setAttribute('position', new THREE.BufferAttribute(pArray, 3));
        particlesGeo.setAttribute('color', new THREE.BufferAttribute(pColors, 3));

        const particlesMat = new THREE.PointsMaterial({
            map: createEmberTexture(),
            vertexColors: true,
            size: 0.12,
            transparent: true,
            opacity: 0.8,
            blending: THREE.AdditiveBlending,
            depthWrite: false
        });

        const particlesMesh = new THREE.Points(particlesGeo, particlesMat);
        scene.add(particlesMesh);

        // ==========================================
        // 7. Camera Scrollytelling Timeline
        // ==========================================
        const cameraTL = gsap.timeline({
            scrollTrigger: {
                trigger: "#scroll-proxy",
                start: "top top",
                end: "bottom bottom",
                scrub: 1
            }
        });

        // Linear descent of camera from y = 0 (Hero) to y = -28 (Case 2 / Viewport 3)
        cameraTL.to(cameraGroup.position, {
            y: -28,
            ease: "none"
        });

        // ==========================================
        // 8. Post-Processing Pipeline
        // ==========================================
        const composer = new EffectComposer(renderer);
        composer.addPass(new RenderPass(scene, camera));

        // UnrealBloomPass tuned to isolate emissive highlights without blowing out the dark background
        const bloomPass = new UnrealBloomPass(
            new THREE.Vector2(window.innerWidth, window.innerHeight),
            0.75, // Strength
            0.55, // Radius
            0.80  // Threshold
        );
        composer.addPass(bloomPass);

        if (!isMobile) {
            const bokehPass = new BokehPass(scene, camera, {
                focus: 18.0,
                aperture: 0.0001,
                maxblur: 0.015,
                width: window.innerWidth,
                height: window.innerHeight
            });
            composer.addPass(bokehPass);
        }

        const rgbShiftPass = new ShaderPass(RGBShiftShader);
        rgbShiftPass.uniforms['amount'].value = 0.0005;
        composer.addPass(rgbShiftPass);

        // ==========================================
        // 9. Ultra-Lightweight Screen Proximity Hover (Zero Raycaster Overhead)
        // ==========================================
        let mouseX = 0;
        let mouseY = 0;
        let targetX = 0;

        let isHoveredObj1 = false;
        let isHoveredObj2 = false;
        let isHoveredObj3 = false;

        let obj1CurrentScale = 1.0;
        let obj2CurrentScale = 1.0;
        let obj3CurrentScale = 1.0;

        window.addEventListener('mousemove', (e) => {
            mouseX = (e.clientX / window.innerWidth) * 2 - 1;
            mouseY = -(e.clientY / window.innerHeight) * 2 + 1;
        });

        // ==========================================
        // 10. Render & Particle Physics Animation Loop
        // ==========================================
        const clock = new THREE.Clock();

        function animate() {
            const time = clock.getElapsedTime();

            // --- Zero-CPU 2D Radial Proximity Check ---
            const mouseDistFromCenter = Math.sqrt(mouseX * mouseX + mouseY * mouseY);
            const currentCamY = cameraGroup.position.y;

            // Hover Hero when camera is near Y = 0 and cursor is near center
            isHoveredObj1 = (Math.abs(currentCamY) < 5.0) && (mouseDistFromCenter < 0.45);

            // Hover Case 1 when camera is near Y = -14 and cursor is near center
            isHoveredObj2 = (Math.abs(currentCamY - (-14)) < 5.0) && (mouseDistFromCenter < 0.45);

            // Hover Case 2 when camera is near Y = -28 and cursor is near center
            isHoveredObj3 = (Math.abs(currentCamY - (-28)) < 5.0) && (mouseDistFromCenter < 0.45);

            const desiredCursor = (isHoveredObj1 || isHoveredObj2 || isHoveredObj3) ? 'pointer' : 'default';
            if (document.body.style.cursor !== desiredCursor) {
                document.body.style.cursor = desiredCursor;
            }

            // --- Smooth Parent Group Matrix Scale & Light Surge (Zero-Traversal) ---
            const targetLight1 = isHoveredObj1 ? 160.0 : 48.0;
            const targetLight2 = isHoveredObj2 ? 100.0 : 6.0;
            const targetLight3 = isHoveredObj3 ? 100.0 : 6.0;

            const targetScale1 = isHoveredObj1 ? 1.08 : 1.0;
            const targetScale2 = isHoveredObj2 ? 1.08 : 1.0;
            const targetScale3 = isHoveredObj3 ? 1.08 : 1.0;

            obj1CurrentScale += (targetScale1 - obj1CurrentScale) * 0.08;
            obj2CurrentScale += (targetScale2 - obj2CurrentScale) * 0.08;
            obj3CurrentScale += (targetScale3 - obj3CurrentScale) * 0.08;

            obj1Parallax.scale.setScalar(obj1CurrentScale);
            obj2Parallax.scale.setScalar(obj2CurrentScale);
            obj3Parallax.scale.setScalar(obj3CurrentScale);

            if (obj1Light) {
                obj1Light.intensity += (targetLight1 - obj1Light.intensity) * 0.08;
            }
            if (obj2Light) {
                obj2Light.intensity += (targetLight2 - obj2Light.intensity) * 0.08;
            }
            if (obj3Light) {
                obj3Light.intensity += (targetLight3 - obj3Light.intensity) * 0.08;
            }

            // Subtle Mouse Parallax (only Y rotation, X rotation removed)
            targetX = mouseX * 0.1;

            [obj1Parallax, obj2Parallax, obj3Parallax].forEach(pGroup => {
                pGroup.rotation.y += (targetX - pGroup.rotation.y) * 0.05;
            });

            // Background Parallax Interaction
            if (typeof bgGroup !== 'undefined') {
                bgGroup.position.x += (mouseX * 2 - bgGroup.position.x) * 0.02;
                bgGroup.position.y += (-mouseY * 2 - bgGroup.position.y) * 0.02;
            }

            // Project 3D Mouse Position into Particle Corridor
            const mouse3DX = mouseX * 18;
            const mouse3DY = cameraGroup.position.y + (mouseY * 10);
            const mouse3DZ = 0;

            const positions = particlesGeo.attributes.position.array;
            const repulsionRadius = 7.0;
            const repulsionRadiusSq = repulsionRadius * repulsionRadius;

            for (let i = 0; i < pCount; i++) {
                const i3 = i * 3;
                let px = positions[i3];
                let py = positions[i3 + 1];
                let pz = positions[i3 + 2];

                // 1. Base Thermal Heat Motion (Upward + Oscillation)
                py += velocities[i3 + 1];
                px += Math.sin(time * 1.5 + particleOffsets[i]) * 0.015 + velocities[i3];
                pz += Math.cos(time * 1.5 + particleOffsets[i]) * 0.015 + velocities[i3 + 2];

                // 2. Interactive Wind / Mouse Repulsion Physics
                const dx = px - mouse3DX;
                const dy = py - mouse3DY;
                const dz = pz - mouse3DZ;
                const distSq = dx * dx + dy * dy + dz * dz;

                if (distSq < repulsionRadiusSq && distSq > 0.001) {
                    const dist = Math.sqrt(distSq);
                    const force = (1 - dist / repulsionRadius) * 0.12;
                    velocities[i3] += (dx / dist) * force;
                    velocities[i3 + 1] += (dy / dist) * force;
                    velocities[i3 + 2] += (dz / dist) * force;
                }

                // 3. Friction Damping (Returns smooth velocity back to thermal flow)
                velocities[i3] *= 0.95;
                velocities[i3 + 2] *= 0.95;
                velocities[i3 + 1] = velocities[i3 + 1] * 0.95 + baseVelocitiesY[i] * 0.05;

                // 4. Infinite Respawn Recycling (Resets Y to -55 when rising above Y = 15)
                if (py > 15) {
                    py = -55;
                    px = (Math.random() - 0.5) * 40;
                    pz = (Math.random() - 0.5) * 40;
                }

                positions[i3] = px;
                positions[i3 + 1] = py;
                positions[i3 + 2] = pz;
            }

            particlesGeo.attributes.position.needsUpdate = true;

            // HUD Layer Opacity Sync (Zero Performance Overhead)
            const hudCase1 = document.getElementById('hud-case1');
            const hudCase2 = document.getElementById('hud-case2');
            if (hudCase1) hudCase1.style.opacity = isHoveredObj2 ? '1' : '0';
            if (hudCase2) hudCase2.style.opacity = isHoveredObj3 ? '1' : '0';

            composer.render();
            requestAnimationFrame(animate);
        }
        animate();

        // ==========================================
        // 11. Click Interaction & Side Panel Expansion
        // ==========================================
        let activeExpandedObj = null;

        window.addEventListener('click', () => {
            if (activeExpandedObj) return; // Panel already open

            if (isHoveredObj2) {
                activeExpandedObj = obj2Parallax;
                openCasePanel("CLIENT 01: SAAS REFRESH", "A visual breakdown of the cloud infrastructure, spatial design tokens, and systematic refresh implemented for Client 01.");
            } else if (isHoveredObj3) {
                activeExpandedObj = obj3Parallax;
                openCasePanel("CLIENT 02: AI PLATFORM", "Deep dive into the neural architecture, real-time spatial data visualizer, and custom web interface for Client 02.");
            }
        });

        function openCasePanel(title, description) {
            lenis.stop();
            document.getElementById('detail-title').innerText = title;
            document.getElementById('detail-desc').innerText = description;
            document.getElementById('detail-panel').style.right = '0';

            if (activeExpandedObj) {
                gsap.to(activeExpandedObj.position, {
                    x: -2.5,
                    duration: 0.8,
                    ease: "power3.out"
                });
                gsap.to(activeExpandedObj.rotation, {
                    y: "+=0.5",
                    duration: 0.8,
                    ease: "power3.out"
                });
            }
        }

        document.getElementById('close-panel').addEventListener('click', (e) => {
            e.stopPropagation();
            document.getElementById('detail-panel').style.right = '-50vw';

            if (activeExpandedObj) {
                gsap.to(activeExpandedObj.position, {
                    x: 0,
                    duration: 0.8,
                    ease: "power3.out"
                });
                gsap.to(activeExpandedObj.rotation, {
                    y: 0,
                    duration: 0.8,
                    ease: "power3.out",
                    onComplete: () => {
                        activeExpandedObj = null;
                        lenis.start();
                    }
                });
            } else {
                lenis.start();
            }
        });

        // Window Resize Handler
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
